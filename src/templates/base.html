<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}均线趋势观测{% endblock %}</title>
<style>
  :root{
    --up:#d5342b; --down:#0a9e4a; --line:#e9e9e9; --head:#f4f4f5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f1f1f1;color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .topbar{background:#fff;border-bottom:1px solid #e6e6e6;padding:12px 26px;display:flex;
    align-items:center;gap:18px;}
  .brand{font-weight:800;font-size:16px;color:#1a1a1a;text-decoration:none;}
  .nav-link{color:#555;text-decoration:none;font-size:14px;}
  .nav-link:hover{color:#2f6fd0;}
  .wrap{max-width:1240px;margin:22px auto;padding:0 18px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    margin-bottom:18px;}
  .date-form label{font-size:13px;color:#777;margin-right:6px;}
  .date-form select{padding:6px 10px;border:1px solid #d8d8d8;border-radius:7px;font-size:14px;}
  .actions{display:flex;gap:10px;}
  .btn{display:inline-block;padding:8px 14px;border-radius:8px;background:#2f6fd0;color:#fff;
    text-decoration:none;font-size:13.5px;font-weight:600;}
  .btn:hover{background:#2860bd;}
  .btn.ghost{background:#fff;border:1px solid #d0d0d0;color:#444;}
  h2.section{font-size:17px;margin:26px 0 10px;padding-left:10px;border-left:4px solid #2f6fd0;}
  .card{background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.06);
    padding:16px 18px;overflow-x:auto;margin-bottom:8px;}
  table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;}
  th{background:var(--head);color:#4a4a4a;font-weight:600;font-size:13px;padding:10px 6px;
    border:1px solid var(--line);white-space:nowrap;}
  td{padding:8px 6px;border:1px solid var(--line);text-align:center;white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:#f7fbff;}
  .code{color:#444;font-family:Consolas,monospace;font-size:13px;}
  .name{text-align:left;padding-left:14px;font-weight:600;}
  .num{font-family:Consolas,monospace;font-weight:600;}
  .pos{color:var(--up);font-weight:700;}
  .neg{color:var(--down);font-weight:700;}
  .dev{font-weight:800;}
  .trend{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;
    padding:0 4px;border-radius:4px;background:#2f6fd0;color:#fff;font-weight:800;font-size:13px;}
  .rc-up{color:#e07b39;font-weight:800;}
  .rc-down{color:#2fa869;font-weight:800;}
  .rc-flat{color:#b6b6b6;font-weight:700;}
  .err{color:#c0392b;font-size:12.5px;text-align:left;padding-left:14px;}
  .legend{margin-top:8px;font-size:12.5px;color:#666;line-height:1.9;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;}
  .cfg-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .cfg-table th,.cfg-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
  .cfg-table th{background:var(--head);}
  .muted{color:#999;font-size:12px;}
  footer{text-align:center;color:#aaa;font-size:12px;margin:30px 0 10px;}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="brand">均线趋势观测 · 鱼盆趋势模型</a>
  <a href="/config" class="nav-link">监控配置</a>
</div>
<div class="wrap">
  {% block content %}{% endblock %}
  <footer>数据仅供市场历史风格趋势观察，不构成任何投资建议 · 参考 OG-Wang/moving-average-monitor 思路实现</footer>
</div>
</body>
</html>
